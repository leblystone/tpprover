// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
// Keep generated library build outputs centralized. On Windows, Gradle can
// trip over transient locks when each plugin writes into its own package dir.
subprojects { subproject ->
    if (subproject.path != ':app') {
        def safeProjectPath = subproject.path.replace(':', '_').replaceAll('[^A-Za-z0-9_.-]', '_')
        subproject.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("subprojects/${safeProjectPath}"))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

