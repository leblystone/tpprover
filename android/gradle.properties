# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# JVM heap and encoding. 4GB prevents OOM on large transforms.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# --- Windows + Android Studio file-locking mitigations ---

# Persistent daemon - reused between Studio builds, so handles get
# released cleanly inside the same JVM rather than racing with new ones.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000

# Disable Gradle file-system watcher - on Windows it keeps file handles
# open against build outputs and conflicts with Studio's own VFS.
org.gradle.vfs.watch=false

# Single worker = no parallel transform race conditions on Windows.
org.gradle.workers.max=1

# No project-level parallelism either.
org.gradle.parallel=false

# Build cache OFF on Windows - cache restore holds file handles long
# enough to race with the next task that wants to delete/recreate the dir.
org.gradle.caching=false

# Configuration cache off - interacts poorly with some Capacitor plugins.
org.gradle.configuration-cache=false

# Skip Jetifier - we're already on AndroidX, no need to rewrite jars.
android.enableJetifier=false
