<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="google-site-verification" content="ZM9sMlUYDOUeuZIGEwIMD99emQVISLFmHj5MHl6dBpU" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Pep Planner" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Force cache busting for PWA assets -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Cache busting version - updated to force refresh -->
    <meta name="app-version" content="chunk-loading-fix-v8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8A9A8F" />
    <!-- Ensure proper loading on mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>The Pep Planner</title>
  </head>
  <body>
    <div id="root">
      <!-- Mobile loading fallback -->
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui; background-color: #ffffff;">
        <div style="text-align: center;">
          <img 
            src="/tpp_logo.png" 
            alt="The Pep Planner Logo" 
            style="width: 80px; height: 80px; animation: pulse 1.5s ease-in-out infinite; display: block; margin: 0 auto;"
          />
        </div>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { 
            transform: scale(1);
            opacity: 1;
          }
          50% { 
            transform: scale(1.2);
            opacity: 0.9;
          }
        }
        /* Hide reCAPTCHA badge */
        .grecaptcha-badge {
          visibility: hidden !important;
          opacity: 0 !important;
          display: none !important;
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
