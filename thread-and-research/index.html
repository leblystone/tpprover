<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thread & Research - Premium peptide research merchandise. Coming soon March 2026.">
    <title>Thread & Research | Coming Soon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karma:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <main class="hero-container">
        <div class="content-frame">
            <header class="brand-header">
                <img src="tr-logo.png" alt="Thread & Research" class="brand-logo">
            </header>

            <section class="announcement">
                
                <div class="main-launch-display">
                    <span class="launch-label">Launching</span>
                    <h1 class="launch-date-large">March 2026</h1>
                </div>
            </section>

            <div class="notify-section">
                <p class="notify-text">Gain early access to the collection.</p>
                <form class="modern-form" id="emailSignup">
                    <div class="input-wrapper">
                        <input type="email" id="signup-email" placeholder="email@address.com" required>
                        <button type="submit" aria-label="Subscribe">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="status-message" id="signupMessage"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
